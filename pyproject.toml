[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-sysadmin-toolkit"
version = "0.1.0"
description = "Diagnostic Linux et sauvegardes locales avec simulation par défaut"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
linux-toolkit = "sysadmin_toolkit.__main__:main"

[tool.setuptools.packages.find]
include = ["sysadmin_toolkit*"]
